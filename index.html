<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uma BK League Tournament</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
          },
          colors: {
            'uma-green': '#4CAF50',
            'uma-dark-green': '#2E7D32',
            'uma-yellow': '#FFEB3B',
            'uma-gold': '#FFC107',
            'uma-brown': '#5D4037',
            'uma-light-green': '#C8E6C9',
            'uma-bg': '#F1F8E9',
            'uma-bg-dark': '#1a291a',
            'uma-bg-dark-secondary': '#253825',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            'slide-in-right': 'slideInRight 0.5s ease-out forwards',
            'pulse-bright': 'pulseBright 1.5s infinite',
            'zoom-in': 'zoomIn 0.3s ease-out forwards',
            'text-highlight-pulse': 'textHighlightPulse 1.5s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideInRight: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            pulseBright: {
              '0%, 100%': { filter: 'brightness(1)', transform: 'scale(1)' },
              '50%': { filter: 'brightness(1.1)', transform: 'scale(1.05)' },
            },
            zoomIn: {
              '0%': { opacity: '0', transform: 'scale(0.9)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            textHighlightPulse: {
                '0%': { textShadow: '0 0 0px rgba(255, 235, 59, 0)' },
                '50%': { textShadow: '0 0 12px rgba(255, 235, 59, 0.8)' },
                '100%': { textShadow: '0 0 0px rgba(255, 235, 59, 0)' },
            }
          }
        }
      }
    }
    </script>

<script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5"
      }
    }
    </script>
</head>
<body class="bg-uma-bg dark:bg-uma-bg-dark font-sans transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
